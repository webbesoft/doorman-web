name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: doorman
          POSTGRES_PASSWORD: contract-fixture-password
          POSTGRES_DB: doorman_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doorman -d doorman_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: contract-fixture-password
          MYSQL_DATABASE: doorman_test
          MYSQL_USER: doorman
          MYSQL_PASSWORD: contract-fixture-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DOORMAN_TEST_POSTGRES_DSN: postgres://doorman:contract-fixture-password@127.0.0.1:5432/doorman_test?sslmode=disable
      DOORMAN_TEST_MYSQL_DSN: doorman:contract-fixture-password@tcp(127.0.0.1:3306)/doorman_test?parseTime=true&tls=false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Generate, race-test all databases and tracker, vet, build
        run: make check
      - name: Audit dependencies
        run: make security
      - name: Build and exercise container replacement and recovery
        run: make container-check
