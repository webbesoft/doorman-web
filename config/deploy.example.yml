# Kamal example. Run the explicit migration step before starting a new release.
# See README.md for configuration, backup, and migration requirements.
service: doorman
image: webbesoft/doorman-web
servers:
  web:
    - 192.0.2.10
proxy:
  ssl: true
  host: analytics.example.com
  app_port: 8080
  forward_headers: true
  response_timeout: 10
  buffering:
    max_request_body: 16384
    memory: 16384
  logging:
    request_headers: []
  healthcheck:
    path: /readyz
registry:
  server: ghcr.io
  username: your-registry-user
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
volumes:
  - doorman_data:/data
env:
  clear:
    APP_ENV: production
    DB_PROVIDER: sqlite
    DB_PATH: /data/analytics.db
    DOORMAN_ALLOWED_HOSTS: example.com,www.example.com
  secret:
    - DOORMAN_ADMIN_USER
    - DOORMAN_ADMIN_PASSWORD
    - DOORMAN_SESSION_SECRET
    # Set this to the actual, narrow source CIDR of your Kamal proxy.
    - DOORMAN_TRUSTED_PROXIES
